baseURL = "https://frothy.dev/"
languageCode = "en-us"
title = "Frothy"
relativeURLs = true
disableKinds = ["taxonomy", "term"]

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    excludeFiles = ["test/**"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms", "llmsfull"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokailight"
    lineNos = false
    noClasses = false

[params]
  description = "A live lexical language for programmable devices."
  frothyRelease = "v0.1.22"
